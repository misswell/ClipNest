name: ClipNest
options:
  bundleIdPrefix: com.tertiaryinfotech
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "GU9WTSTX9M"
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "ClipNest"
    INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Tertiary Infotech Academy Pte Ltd"
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.2.0"
  # Local AI (China plan §18, §19). Pinned to validated releases, never `main`:
  # these two tags were built and linked for both macOS 14 and the iOS 17 Simulator
  # in standalone prototypes before being added here.
  #   mlx-swift-lm 3.31.4  -> MLXLLM, MLXLMCommon, MLXHuggingFace
  #   swift-transformers 1.3.4 -> Tokenizers (the `#huggingFaceTokenizerLoader()` macro)
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: "3.31.4"
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: "1.3.4"

targets:
  ClipNest:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - Sources
      - path: Resources/SampleVault
        type: folder
    dependencies:
      - package: SwiftTerm
      # Only the four products the local model runtime needs. `MLXLLM` carries the
      # Qwen3 architecture, `MLXLMCommon` the container/`ChatSession` API,
      # `MLXHuggingFace` the tokenizer-loader macro, `Tokenizers` its implementation.
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tertiaryinfotech.clipnest
        PRODUCT_NAME: "ClipNest"
        TARGETED_DEVICE_FAMILY: "1,2"
        # The macOS build stays automatic/non-sandboxed for the embedded terminal;
        # the iOS App Store archive uses the dedicated distribution profile only on
        # the application target, so SwiftTerm package targets remain automatic.
        'CODE_SIGN_STYLE[sdk=iphoneos*]': Manual
        'CODE_SIGN_IDENTITY[sdk=iphoneos*]': "Apple Distribution"
        'PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]': "ClipNest AppStore"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Alternate icons are an iOS mechanism; scoping to iOS SDKs keeps the macOS
        # actool pass from warning about the iOS-only sets.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES[sdk=iphoneos*]: "AppIconDay AppIconNight"
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES[sdk=iphonesimulator*]: "AppIconDay AppIconNight"
        INFOPLIST_FILE: Sources/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    # Sandbox is OFF for this personal build: embedded terminals must spawn a real
    # login shell with full filesystem access. This build is NOT App Store eligible.
    entitlements:
      path: Sources/MarkdownVault.entitlements
      properties:
        com.apple.security.app-sandbox: false

  ClipNestTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Tests
    dependencies:
      - target: ClipNest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tertiaryinfotech.clipnest.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ClipNest.app/Contents/MacOS/ClipNest"

  # On-device counterpart to ClipNestTests (§36⑫). `ClipNestTests` is macOS-only, so its
  # live-inference tests can never run on an iPhone. This target carries just the
  # device-safe subset, so `xcodebuild test -destination 'id=<udid>'` can prove MLX and the
  # real weights work on hardware.
  ClipNestDeviceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - TestsDevice
    dependencies:
      - target: ClipNest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tertiaryinfotech.clipnest.devicetests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ClipNest.app/ClipNest"

schemes:
  ClipNest:
    build:
      targets:
        ClipNest: all
    test:
      config: Debug
      targets:
        - name: ClipNestTests

  # `xcodebuild test -scheme ClipNestDevice -destination 'id=<device-udid>'` — the only way
  # to exercise the real weights on hardware, since ClipNestTests cannot build for iOS.
  ClipNestDevice:
    build:
      targets:
        ClipNest: all
        ClipNestDeviceTests: [test]
    test:
      config: Debug
      targets:
        - name: ClipNestDeviceTests
