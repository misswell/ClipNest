# Temporary HTTP-only config used while the first certificate is issued.
server {
    listen 80;
    listen [::]:80;
    server_name clipnest.liuguofeng.com;

    root /home/wwwroot/clipnest.liuguofeng.com;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /home/wwwroot/default;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
