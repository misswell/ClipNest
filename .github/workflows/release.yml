name: Release ClipNest (macOS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clipnest-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign, notarize, and publish
    runs-on: macos-15
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select newest Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcode_app="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)"
          [[ -n "$xcode_app" && -d "$xcode_app" ]] || {
            echo "No Xcode installation was found on the runner." >&2
            exit 1
          }
          sudo xcode-select --switch "$xcode_app"
          xcodebuild -version

      - name: Validate release credentials
        shell: bash
        run: |
          set -euo pipefail
          for secret in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD \
                        APPLE_DEVELOPER_ID APPLE_TEAM_ID \
                        APPLE_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Missing repository secret $secret"
              exit 1
            fi
          done

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      # ClipNest.xcodeproj is gitignored — project.yml is the source of truth, and so
      # is its MARKETING_VERSION, which the release tag has to match.
      - name: Resolve and validate version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"?([0-9][^"]*)"?[[:space:]]*$/\1/p' project.yml | head -1)"
          [[ -n "$version" ]] || { echo "Could not read MARKETING_VERSION from project.yml" >&2; exit 1; }

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            [[ "$tag" == "v$version" ]] || {
              echo "Tag $tag does not match project.yml version v$version" >&2
              exit 1
            }
          else
            tag="v$version"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $tag already exists; bump MARKETING_VERSION or delete that release first." >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Preparing ClipNest $version ($tag)"

      # Ad-hoc signed on purpose: the Developer ID certificate has not been imported
      # yet at this point, and this build is thrown away — only the release artifact
      # below needs a real identity.
      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild test -project ClipNest.xcodeproj -scheme ClipNest \
            -destination 'platform=macOS' -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/clipnest-tests" \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER=

      - name: Import Developer ID certificate
        shell: bash
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/clipnest-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          certificate_path="$RUNNER_TEMP/clipnest-developer-id.p12"

          cleanup() {
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            rm -f "$certificate_path"
          }
          trap cleanup EXIT

          # `base64 -D` on macOS; the Linux spelling of -d is not available here.
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path" >/dev/null
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security >/dev/null
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path" >/dev/null
          # Keep the runner's own keychains in the search list and make the signing
          # keychain the default. Replacing the list outright left xcodebuild unable to
          # resolve the identity even though `find-identity <path>` reported it: that
          # call passes the keychain explicitly, so it never exercised the search list.
          existing="$(security list-keychains -d user | sed 's/^[[:space:]]*//; s/"//g')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain_path" $existing
          security default-keychain -s "$keychain_path"

          # The real check: no explicit keychain, so this only sees the search list.
          echo "--- identities visible through the search list ---"
          security find-identity -v -p codesigning

          # A keychain is only unlocked for the session that unlocked it, so the state
          # set up here does not survive into the step that actually signs. Hand the
          # details over so that step can unlock again for itself.
          {
            echo "CLIPNEST_KEYCHAIN_PATH=$keychain_path"
            echo "CLIPNEST_KEYCHAIN_PASSWORD=$keychain_password"
          } >> "$GITHUB_ENV"

      - name: Build, sign, notarize, staple, and verify
        shell: bash
        run: |
          set -euo pipefail
          export CLIPNEST_OUTPUT_DIR="$RUNNER_TEMP/clipnest-release"
          mkdir -p "$CLIPNEST_OUTPUT_DIR"
          echo "CLIPNEST_OUTPUT_DIR=$CLIPNEST_OUTPUT_DIR" >> "$GITHUB_ENV"

          # Unlock here rather than relying on the import step: unlocking does not carry
          # across steps, and codesign reports a locked keychain as "The specified item
          # could not be found in the keychain", which reads like a missing certificate.
          keychain_path="$CLIPNEST_KEYCHAIN_PATH"
          keychain_password="$CLIPNEST_KEYCHAIN_PASSWORD"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          existing="$(security list-keychains -d user | sed 's/^[[:space:]]*//; s/"//g')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain_path" $existing
          security default-keychain -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

          CLIPNEST_DEVELOPER_ID="$APPLE_DEVELOPER_ID" \
          CLIPNEST_DEVELOPER_TEAM_ID="$APPLE_TEAM_ID" \
          CLIPNEST_NOTARY_APPLE_ID="$APPLE_ID" \
          CLIPNEST_NOTARY_PASSWORD="$APPLE_APP_SPECIFIC_PASSWORD" \
              Scripts/distribute-app.sh

      - name: Verify final release package
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          app="dist/build/Build/Products/Release/ClipNest.app"
          zip_path="$CLIPNEST_OUTPUT_DIR/ClipNest-$RELEASE_VERSION-macos.zip"
          [[ -f "$zip_path" ]] || { echo "Missing release archive: $zip_path" >&2; exit 1; }

          codesign --verify --deep --strict "$app"
          signature="$(codesign --display --verbose=4 "$app" 2>&1)"
          echo "$signature" | grep -q '^Authority=Developer ID Application:'
          echo "$signature" | grep -q "^TeamIdentifier=$APPLE_TEAM_ID$"
          spctl --assess --type execute --verbose "$app"
          xcrun stapler validate "$app"

          architectures="$(lipo -archs "$app/Contents/MacOS/ClipNest")"
          echo "architectures: $architectures"
          [[ "$architectures" == *arm64* ]]
          [[ "$architectures" == *x86_64* ]]

          # The archive must be the stapled one, so unpack and re-assess.
          rm -rf "$RUNNER_TEMP/unpacked"
          mkdir -p "$RUNNER_TEMP/unpacked"
          ditto -x -k "$zip_path" "$RUNNER_TEMP/unpacked"
          spctl --assess --type execute --verbose "$RUNNER_TEMP/unpacked/ClipNest.app"
          shasum -a 256 "$zip_path"

      - name: Publish GitHub Release
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          archive="$CLIPNEST_OUTPUT_DIR/ClipNest-${RELEASE_VERSION}-macos.zip"
          [[ -f "$archive" ]] || { echo "Missing release archive: $archive" >&2; exit 1; }
          gh release create "$RELEASE_TAG" "$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ClipNest $RELEASE_VERSION" \
            --generate-notes
