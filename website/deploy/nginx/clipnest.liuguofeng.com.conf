# ClipNest static site. HTTP remains available for ACME renewal, then redirects to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name clipnest.liuguofeng.com;

    root /home/wwwroot/clipnest.liuguofeng.com;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /home/wwwroot/default;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clipnest.liuguofeng.com;

    root /home/wwwroot/clipnest.liuguofeng.com;
    index index.html;

    ssl_certificate /usr/local/nginx/conf/ssl/clipnest.liuguofeng.com/fullchain.cer;
    ssl_certificate_key /usr/local/nginx/conf/ssl/clipnest.liuguofeng.com/clipnest.liuguofeng.com.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:ClipNestSSL:10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;

    location ^~ /.well-known/acme-challenge/ {
        root /home/wwwroot/default;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
